syntax = "proto3";

option csharp_namespace = "Backend.Protos";

package encuestas;

service AuthService {
  rpc Login (LoginRequest) returns (LoginReply);
}

service EncuestaService {
  rpc GetSurveys (SurveyListRequest) returns (SurveyListReply);
  rpc GetSurveyDetails (SurveyDetailsRequest) returns (SurveyDetailsReply);
  rpc SubmitSurveyResponse (SubmitResponseRequest) returns (SubmitResponseReply);
  rpc CreateSurvey (CreateSurveyRequest) returns (CreateSurveyReply);
  rpc GetSurveyAnalytics (SurveyAnalyticsRequest) returns (SurveyAnalyticsReply);
  rpc StreamSurveyAnalytics (SurveyAnalyticsRequest) returns (stream SurveyAnalyticsReply);
}

service CasosService {
  rpc CreateCaso (CreateCasoRequest) returns (CreateCasoReply);
  rpc GetCasos (CasoListRequest) returns (CasoListReply);
  rpc UpdateCasoEstado (UpdateCasoEstadoRequest) returns (UpdateCasoEstadoReply);
}

service EstudianteService {
  rpc UploadEstudiantesExcel (UploadExcelRequest) returns (UploadExcelReply);
  rpc GetEstudiantes (EstudianteListRequest) returns (EstudianteListReply);
}

service DashboardService {
  rpc GetDashboard (DashboardRequest) returns (DashboardReply);
}

service ColegioService {
  rpc GetColegios (GetColegiosRequest) returns (GetColegiosReply);
  rpc CreateColegio (CreateColegioRequest) returns (CreateColegioReply);
}

service AdminService {
  rpc GetAllUsers (GetAllUsersRequest) returns (GetAllUsersReply);
  rpc ResetUserPassword (ResetUserPasswordRequest) returns (ResetUserPasswordReply);
  rpc UpdateUserProfile (UpdateUserProfileRequest) returns (UpdateUserProfileReply);
}

// Mensajes de Autenticación
message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginReply {
  bool success = 1;
  string message = 2;
  int32 user_id = 3;
  string nombre = 4;
  string apellido = 5;
  string rol = 6; // SUPER_ADMIN, Rector, Orientador, Coordinador, Estudiante
  string jornada = 7;
  int32 estudiante_id = 8;
  int32 colegio_id = 9;
  string colegio_nombre = 10;
}

// Mensajes de Colegios (SaaS SuperAdmin)
message GetColegiosRequest {
  int32 user_id = 1;
}

message ColegioMessage {
  int32 id = 1;
  string nombre = 2;
  string nit = 3;
  string codigo_dane = 4;
  string direccion = 5;
  string telefono = 6;
  string email_contacto = 7;
  string fecha_registro = 8;
  bool activo = 9;
  int32 total_estudiantes = 10;
  int32 total_usuarios = 11;
}

message GetColegiosReply {
  repeated ColegioMessage colegios = 1;
}

message CreateColegioRequest {
  string nombre = 1;
  string nit = 2;
  string codigo_dane = 3;
  string direccion = 4;
  string telefono = 5;
  string email_contacto = 6;
}

message CreateColegioReply {
  bool success = 1;
  string message = 2;
  int32 colegio_id = 3;
}

// Mensajes de Administración Global de Usuarios (SUPER_ADMIN)
message GetAllUsersRequest {
  int32 super_admin_id = 1;
  int32 colegio_id_filter = 2; // 0 para todos
}

message UserDetailMessage {
  int32 id = 1;
  int32 colegio_id = 2;
  string colegio_nombre = 3;
  string username = 4;
  string password_hash = 5; // Visible para el SUPER_ADMIN
  string nombre = 6;
  string apellido = 7;
  string email = 8;
  string telefono = 9;
  string tipo_identificacion = 10;
  string numero_identificacion = 11;
  string rol = 12;
  string jornada = 13;
}

message GetAllUsersReply {
  repeated UserDetailMessage usuarios = 1;
}

message ResetUserPasswordRequest {
  int32 super_admin_id = 1;
  int32 target_user_id = 2;
  string new_password = 3;
}

message ResetUserPasswordReply {
  bool success = 1;
  string message = 2;
}

// Mensajes de Carga Masiva Excel de Estudiantes
message UploadExcelRequest {
  bytes file_bytes = 1;
  string file_name = 2;
  int32 colegio_id = 3;
  int32 creado_por_id = 4;
}

message UploadExcelReply {
  bool success = 1;
  string message = 2;
  int32 total_procesados = 3;
  int32 creados_exitosos = 4;
  int32 omitidos_duplicados = 5;
  repeated string errores = 6;
}

message EstudianteListRequest {
  int32 colegio_id = 1;
  string jornada = 2;
  string curso = 3;
}

message EstudianteMessage {
  int32 id = 1;
  int32 usuario_id = 2;
  string nombre = 3;
  string apellido = 4;
  string tipo_identificacion = 5;
  string numero_identificacion = 6;
  string email = 7;
  string telefono = 8;
  string curso = 9;
  string jornada = 10;
  string sexo = 11;
  string eps = 12;
  string direccion = 13;
}

message EstudianteListReply {
  repeated EstudianteMessage estudiantes = 1;
}

// Mensajes de Encuestas
message SurveyListRequest {
  int32 user_id = 1;
  int32 colegio_id = 2;
}

message SurveyMessage {
  int32 id = 1;
  string titulo = 2;
  string descripcion = 3;
  string fecha_creacion = 4;
  int32 total_respuestas = 5;
}

message SurveyListReply {
  repeated SurveyMessage encuestas = 1;
}

message SurveyDetailsRequest {
  int32 encuesta_id = 1;
}

message OpcionMessage {
  int32 id = 1;
  string texto = 2;
}

message PreguntaMessage {
  int32 id = 1;
  string texto = 2;
  string tipo_respuesta = 3; // SeleccionUnica, TextoAbierto, CorreoElectronico, NumeroTelefono, EscalaNumerica
  bool es_obligatoria = 4;
  string restriccion = 5;
  string prefijo_pais = 6; // +57, +1, +52, +34, etc.
  repeated OpcionMessage opciones = 7;
}

message SurveyDetailsReply {
  int32 id = 1;
  string titulo = 2;
  string descripcion = 3;
  repeated PreguntaMessage preguntas = 4;
}

message PreguntaRespuestaInput {
  int32 pregunta_id = 1;
  string respuesta_texto = 2;
  int32 opcion_seleccionada_id = 3;
}

message SubmitResponseRequest {
  int32 encuesta_id = 1;
  int32 estudiante_id = 2;
  repeated PreguntaRespuestaInput respuestas = 3;
}

message SubmitResponseReply {
  bool success = 1;
  string message = 2;
}

message PreguntaInput {
  string texto = 1;
  string tipo_respuesta = 2;
  bool es_obligatoria = 3;
  string restriccion = 4;
  string prefijo_pais = 5;
  repeated string opciones = 6;
}

message CreateSurveyRequest {
  string titulo = 1;
  string descripcion = 2;
  int32 creado_por_id = 3;
  int32 colegio_id = 4;
  repeated PreguntaInput preguntas = 5;
}

message CreateSurveyReply {
  bool success = 1;
  string message = 2;
  int32 encuesta_id = 3;
}

// Mensajes de Analítica de Respuestas de Encuestas (Dashboard de Respuestas)
message SurveyAnalyticsRequest {
  int32 encuesta_id = 1;
}

message OpcionStatMessage {
  int32 opcion_id = 1;
  string texto_opcion = 2;
  int32 cantidad_votos = 3;
  double porcentaje = 4;
}

message PreguntaAnalyticsMessage {
  int32 pregunta_id = 1;
  string texto_pregunta = 2;
  string tipo_respuesta = 3;
  bool es_obligatoria = 4;
  string restriccion = 5;
  string prefijo_pais = 6;
  repeated OpcionStatMessage estadisticas_opciones = 7;
  repeated string respuestas_texto = 8;
}

message SurveyAnalyticsReply {
  int32 encuesta_id = 1;
  string titulo = 2;
  string descripcion = 3;
  int32 total_respuestas = 4;
  repeated PreguntaAnalyticsMessage preguntas_analitica = 5;
}

// Mensajes de Casos
message CreateCasoRequest {
  int32 estudiante_id = 1;
  int32 creado_por_id = 2;
  int32 colegio_id = 3;
  string tipo = 4;
  string descripcion = 5;
  bool requiere_piar = 6;
  bool requiere_dua = 7;
  string discapacidades = 8;
}

message CreateCasoReply {
  bool success = 1;
  string message = 2;
  int32 caso_id = 3;
}

message CasoListRequest {
  int32 user_id = 1;
  string rol = 2;
  int32 colegio_id = 3;
}

message CasoMessage {
  int32 id = 1;
  string estudiante_nombre = 2;
  string estudiante_curso = 3;
  string creado_por_nombre = 4;
  string tipo = 5;
  string descripcion = 6;
  bool requiere_piar = 7;
  bool requiere_dua = 8;
  string discapacidades = 9;
  string fecha_creacion = 10;
  string estado = 11;
}

message CasoListReply {
  repeated CasoMessage casos = 1;
}

message UpdateCasoEstadoRequest {
  int32 caso_id = 1;
  string nuevo_estado = 2;
}

message UpdateCasoEstadoReply {
  bool success = 1;
  string message = 2;
}

// Mensajes de Dashboard
message DashboardRequest {
  int32 user_id = 1;
  string rol = 2;
  int32 colegio_id = 3;
}

message DashboardReply {
  int32 total_estudiantes = 1;
  int32 casos_iniciados = 2;
  int32 casos_en_proceso = 3;
  int32 casos_cerrados = 4;
  int32 total_encuestas = 5;
  int32 total_respuestas = 6;
  int32 total_colegios = 7; // Para SUPER_ADMIN
  int32 total_usuarios = 8;  // Para SUPER_ADMIN
}

// Mensajes de Actualización de Perfil de Usuario
message UpdateUserProfileRequest {
  int32 user_id = 1;
  string nombre = 2;
  string apellido = 3;
  string email = 4;
  string password = 5; // Opcional
}

message UpdateUserProfileReply {
  bool success = 1;
  string message = 2;
}
